
name: Daily Outfit Notification

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  send-outfit:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send outfit notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python morning_notification.py
